name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Fix Missing Android Folder + Kotlin Duplicate
        run: |
          echo "Checking android folder..."
          if [ ! -f "android/build.gradle" ]; then
            echo "android folder missing - recreating it"
            flutter create . --platforms=android
          fi
          
          echo "Fixing Kotlin version to 1.9.22..."
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle || true
          
          echo "Adding Kotlin BOM and exclusions..."
          # BOM add
          if [ -f "android/app/build.gradle" ]; then
            if ! grep -q "kotlin-bom" android/app/build.gradle; then
              sed -i "/dependencies {/a \    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.22')" android/app/build.gradle
            fi
            # Duplicate class fix
            if ! grep -q "exclude group" android/app/build.gradle; then
              sed -i "/^android {/i configurations {\n    implementation {\n        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n    }\n}\n" android/app/build.gradle
            fi
          fi
          
          echo "Fix Done"
          ls android/

      - name: Get Packages
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fatiha-Urs-App
          path: build/app/outputs/flutter-apk/app-release.apk
