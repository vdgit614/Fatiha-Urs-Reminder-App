name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          
      - name: Fix Kotlin Duplicate Classes Error
        run: |
          echo "Fixing kotlin version..."
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.10'/" android/build.gradle
          
          echo "Adding kotlin-bom..."
          # android/app/build.gradle में bom add करो अगर नहीं है
          if ! grep -q "kotlin-bom" android/app/build.gradle; then
            sed -i "/^dependencies {/a \    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.10')" android/app/build.gradle
          fi
          
          echo "Fix done - checking..."
          cat android/build.gradle | grep kotlin_version
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Generate Icons
        run: flutter pub run flutter_launcher_icons
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
