name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Fix all build issues
        run: |
          echo "1. Creating missing assets folder..."
          mkdir -p assets
          touch assets/.keep
          
          echo "2. Deleting corrupted launcher icons..."
          rm -rf android/app/src/main/res/mipmap-hdpi
          rm -rf android/app/src/main/res/mipmap-mdpi
          rm -rf android/app/src/main/res/mipmap-xhdpi
          rm -rf android/app/src/main/res/mipmap-xxhdpi
          rm -rf android/app/src/main/res/mipmap-xxxhdpi
          
          echo "3. Recreating clean android folder..."
          flutter create . --platforms=android --project-name fatiha_urs_reminder --org com.vdgit614.fatiha --overwrite
          
          echo "4. Fixing Kotlin version..."
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle || true

      - name: Get Packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fatiha-Urs-App
          path: build/app/outputs/flutter-apk/app-release.apk
