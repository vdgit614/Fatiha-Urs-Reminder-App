name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Fix Duplicate + v1 embedding
        run: |
          mkdir -p assets && touch assets/.keep
          rm -rf android
          flutter create . --platforms=android --project-name fatiha_urs_reminder --org com.vdgit614.fatiha
          
          python3 << 'PY'
          import pathlib, re
          # 1. android/build.gradle - kotlin version
          p = pathlib.Path('android/build.gradle')
          t = p.read_text()
          t = re.sub(r"ext\.kotlin_version = '.*?'", "ext.kotlin_version = '1.9.22'", t)
          p.write_text(t)

          # 2. android/app/build.gradle - REAL duplicate fix
          p2 = pathlib.Path('android/app/build.gradle')
          t = p2.read_text()
          
          # Sahi jagah par configurations.all add karo
          if 'kotlin-stdlib-jdk7' not in t:
              t = t.replace('android {', "configurations.all {\n    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n}\n\nandroid {")

          # BOM add karo
          if 'kotlin-bom' not in t:
              t = t.replace('dependencies {', "dependencies {\n    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.22')")

          # Lint fix
          if 'checkReleaseBuilds' not in t:
              t = t.replace('android {', "android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }")

          p2.write_text(t)
          print("Fixed duplicate, kotlin, lint")
          PY

      - name: Get Packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fatiha-Urs-App
          path: build/app/outputs/flutter-apk/app-release.apk
