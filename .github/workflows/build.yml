name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Rebuild Android v2 embedding
        run: |
          mkdir -p assets && touch assets/.keep
          echo "Deleting old v1 android folder..."
          rm -rf android
          flutter create . --platforms=android --project-name fatiha_urs_reminder --org com.vdgit614.fatiha
          
          python3 << 'PY'
          import pathlib, re, glob
          p = pathlib.Path('android/build.gradle')
          if p.exists():
              t = p.read_text()
              t = re.sub(r"ext\.kotlin_version = '.*?'", "ext.kotlin_version = '1.9.22'", t)
              p.write_text(t)
          p2 = pathlib.Path('android/app/build.gradle')
          if p2.exists():
              t = p2.read_text()
              if 'kotlin-bom' not in t:
                  t = t.replace('dependencies {', "configurations {\n    implementation {\n        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n    }\n}\n\ndependencies {\n    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.22')")
              if 'checkReleaseBuilds' not in t:
                  t = t.replace('android {', "android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }")
              p2.write_text(t)
          for f in glob.glob('android/app/src/main/res/xml/*.xml'):
              txt = pathlib.Path(f).read_text().replace('<exclude domain="external" path="." />', '')
              pathlib.Path(f).write_text(txt)
          print("All patched - v2 embedding ready")
          PY

      - name: Get Packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fatiha-Urs-App
          path: build/app/outputs/flutter-apk/app-release.apk
