name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Fix all build issues
        run: |
          mkdir -p assets
          touch assets/.keep
          
          echo "1. Clean android folder..."
          rm -rf android
          flutter create . --platforms=android --project-name fatiha_urs_reminder --org com.vdgit614.fatiha
          
          echo "2. Fix Kotlin version..."
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle
          
          echo "3. Fix Duplicate Class Error - Adding BOM and exclusions..."
          # BOM add
          sed -i "/^dependencies {/a \    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.22')" android/app/build.gradle
          # Exclude jdk7/jdk8
          sed -i "/^android {/i configurations {\n    implementation {\n        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n    }\n}\n" android/app/build.gradle
          
          echo "4. Fix backup_rules.xml..."
          sed -i 's/<exclude domain="external" path="." \/>//g' android/app/src/main/res/xml/backup_rules.xml || true
          sed -i 's/<exclude domain="external" path="." \/>//g' android/app/src/main/res/xml/data_extraction_rules.xml || true
          
          echo "5. Disable lintVitalRelease..."
          sed -i '/^android {/a \    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }' android/app/build.gradle
          
          echo "All fixes applied!"
          cat android/build.gradle | grep kotlin
          cat android/app/build.gradle | grep -A2 configurations

      - name: Get Packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fatiha-Urs-App
          path: build/app/outputs/flutter-apk/app-release.apk
