name: Build Fatiha Urs APK
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          
      - name: Fix Android Folder
        run: |
          echo "Backing up our files..."
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          if [ ! -f "android/build.gradle" ]; then
            echo "Fixing android folder..."
            rm -rf android
            flutter create --project-name fatiha_urs_reminder . --platforms=android --org com.fatiha.urs
          fi
          echo "Restoring our files..."
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          
      - name: Get Dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fatiha-urs-reminder-apk
          path: build/app/outputs/flutter-apk/app-release.apk
