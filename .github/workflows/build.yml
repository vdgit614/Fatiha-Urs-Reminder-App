name: Build Fatiha Urs APK
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          
      - name: Fix Android Folder
        run: |
          if [ ! -f "android/build.gradle" ]; then
            echo "Android folder incomplete, recreating..."
            rm -rf android
            flutter create --project-name fatiha_urs_reminder . --platforms=android --org com.fatiha.urs
            rm -f lib/main.dart
          fi
          
      - name: Restore Our Icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          echo "Icons will be restored if exists in git"

      - name: Get Dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fatiha-urs-reminder-apk
          path: build/app/outputs/flutter-apk/app-release.apk
