name: fatiha_urs_reminder
description: Fatiha Urs Reminder
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^16.3.2
  timezone: ^0.9.2
  shared_preferences: ^2.2.2
  hijri: ^3.0.0
  adhan: ^2.0.0+1
  share_plus: ^7.2.1
  path_provider: ^2.1.2
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
